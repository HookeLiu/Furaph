[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furaph_shell"
version = "0.1.0"
description = "Furaph 的常驻人类领域与 Agent 编排服务：独立持久化并通过版本化契约连接 Core 与 Plugin。"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "httpx>=0.27,<0.29", "pydantic>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[project.scripts]
furaph-shell = "furaph_shell.cli:main"
